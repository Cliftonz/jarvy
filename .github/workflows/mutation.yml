name: Mutation Testing

on:
  schedule:
    # Run weekly (Saturday at 3 AM UTC)
    - cron: '0 3 * * 6'
  workflow_dispatch:
    inputs:
      modules:
        description: 'Modules to test (comma-separated, e.g., "config,tools/common")'
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Sharded: the single-job run outgrew GitHub's HARD 6h ceiling for
  # hosted-runner jobs (killed at exactly 6h00m on 2026-07-04 and
  # 2026-07-11; last single-job success was 5h37m). `timeout-minutes`
  # cannot be raised past that ceiling, so split the mutant list across
  # 4 parallel shards (~1.5h each) via cargo-mutants' --shard.
  mutation-test:
    name: Mutation Testing (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # v1
        with:
          toolchain: stable

      - name: Install cargo-mutants
        run: cargo install cargo-mutants

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run mutation testing (critical modules)
        run: |
          MODULES="${{ github.event.inputs.modules }}"
          if [ -z "$MODULES" ]; then
            # Default critical modules
            cargo mutants --timeout 300 --jobs 4 \
              --shard ${{ matrix.shard }}/4 \
              -f src/config.rs \
              -f src/tools/common.rs \
              -- --lib
          else
            # User-specified modules
            IFS=',' read -ra MODULE_ARRAY <<< "$MODULES"
            ARGS=()
            for module in "${MODULE_ARRAY[@]}"; do
              ARGS+=(-f "src/${module}.rs")
            done
            cargo mutants --timeout 300 --jobs 4 \
              --shard ${{ matrix.shard }}/4 "${ARGS[@]}" -- --lib
          fi
        continue-on-error: true

      - name: Generate mutation report
        run: |
          echo "## Mutation Testing Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f mutants.out/caught.txt ]; then
            CAUGHT=$(wc -l < mutants.out/caught.txt)
            echo "### Caught Mutations: $CAUGHT" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f mutants.out/missed.txt ]; then
            MISSED=$(wc -l < mutants.out/missed.txt)
            echo "### Missed Mutations: $MISSED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            if [ "$MISSED" -gt 0 ]; then
              {
                echo "<details><summary>Missed mutations (tests did not catch)</summary>"
                echo ""
                echo '```'
                head -50 mutants.out/missed.txt
                echo '```'
                echo "</details>"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [ -f mutants.out/timeout.txt ]; then
            TIMEOUT=$(wc -l < mutants.out/timeout.txt)
            if [ "$TIMEOUT" -gt 0 ]; then
              echo "### Timeouts: $TIMEOUT" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          # Calculate mutation score
          if [ -f mutants.out/caught.txt ] && [ -f mutants.out/missed.txt ]; then
            CAUGHT=$(wc -l < mutants.out/caught.txt)
            MISSED=$(wc -l < mutants.out/missed.txt)
            TOTAL=$((CAUGHT + MISSED))
            if [ "$TOTAL" -gt 0 ]; then
              SCORE=$(echo "scale=1; $CAUGHT * 100 / $TOTAL" | bc)
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "### Mutation Score: ${SCORE}%" >> "$GITHUB_STEP_SUMMARY"

              if (( $(echo "$SCORE < 60" | bc -l) )); then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "⚠️ Mutation score is below 60% target" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
        continue-on-error: true

      - name: Upload mutation results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-results-shard-${{ matrix.shard }}
          path: mutants.out/
          retention-days: 30
