# Security scanning workflow
# Implements PRD-020: Security Scanning Infrastructure
#
# Runs on:
# - Every pull request to main (pre-merge gate)
# - Every release tag (post-merge integration check)
# - Daily schedule at 6 AM UTC (catch new CVEs even on quiet days)
# - Manual dispatch
#
# push-to-main trigger was removed because every PR is already
# validated and the merge commit matches a validated PR head.

name: Security

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Job 1: cargo-audit - RustSec Advisory Database
  audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/advisory-db
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Cargo.lock is intentionally untracked in this repo (CI floats to
      # latest-compatible), but cargo-audit refuses to run without one.
      # Generate it fresh — auditing the latest-compatible resolution is
      # exactly what this job should check anyway.
      - name: Generate lockfile
        run: cargo generate-lockfile

      # No ignores, matching deny.toml's empty [advisories].ignore. Any
      # future ignore must land in both places (cargo-audit has no shared
      # config with cargo-deny).
      - name: Run cargo-audit
        run: cargo audit --deny warnings

  # Job 2: cargo-deny - Licenses, Advisories, Bans, Sources
  deny:
    name: Dependency Check (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # v1
        with:
          toolchain: stable

      # Cargo.lock is untracked (see audit job note); cargo-deny needs one.
      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check all
          arguments: --all-features

  # Job 3: Gitleaks - Secret Scanning
  secrets:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for thorough scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false

  # Job 4: Semgrep - Static Analysis Security Testing (SAST)
  # Blocking on ERROR-severity findings only (#64). WARNING and INFO
  # findings stay advisory and still reach the Security tab via SARIF.
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.repository == 'Cliftonz/jarvy'
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `semgrep-action@v1` has no `generateSarif` input, so the old
      # setup never wrote semgrep.sarif and the upload step always
      # failed. Run the CLI directly instead. This pass exits 0 on
      # findings and writes the full SARIF; `--severity` would also drop
      # lower-severity findings from the SARIF, so the ERROR gate is a
      # separate pass after the upload.
      - name: Run Semgrep
        run: >-
          semgrep scan
          --config p/rust
          --config p/security-audit
          --config p/secrets
          --config p/command-injection
          --sarif --output semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep.sarif
        if: always() && hashFiles('semgrep.sarif') != ''

      - name: Fail on ERROR-severity findings
        run: >-
          semgrep scan
          --config p/rust
          --config p/security-audit
          --config p/secrets
          --config p/command-injection
          --severity ERROR --error
          --exclude semgrep.sarif

  # Job 5: CodeQL - Semantic Analysis
  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.repository == 'Cliftonz/jarvy'
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: rust
          queries: security-extended

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # v1
        with:
          toolchain: stable

      - name: Build for CodeQL Analysis
        run: cargo build --release --all-features

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:rust"

  # Job 6: cargo-geiger - Unsafe Code Audit (informational)
  geiger:
    name: Unsafe Code Audit (cargo-geiger)
    runs-on: ubuntu-latest
    continue-on-error: true  # Advisory, not blocking
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-geiger-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked

      - name: Run cargo-geiger
        run: |
          cargo geiger --all-features --all-targets 2>&1 | tee geiger-report.txt || true
          {
            echo "## Unsafe Code Report"
            echo '```'
            cat geiger-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload geiger report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geiger-report
          path: geiger-report.txt
          retention-days: 30

  # Job 7: Dependency freshness check (scheduled only)
  freshness:
    name: Dependency Freshness
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # v1
        with:
          toolchain: stable

      - name: Install cargo-outdated
        run: cargo install cargo-outdated --locked

      - name: Check outdated dependencies
        run: |
          echo "## Outdated Dependencies" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo outdated --depth 1 >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Summary job - ensures all required checks pass
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [audit, deny, secrets, semgrep, codeql]
    if: always()
    steps:
      - name: Check security status
        run: |
          echo "## Security Scan Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Check each job status
          if [ "${{ needs.audit.result }}" = "success" ]; then
            echo "- :white_check_mark: cargo-audit: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- :x: cargo-audit: ${{ needs.audit.result }}" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.deny.result }}" = "success" ]; then
            echo "- :white_check_mark: cargo-deny: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- :x: cargo-deny: ${{ needs.deny.result }}" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.secrets.result }}" = "success" ]; then
            echo "- :white_check_mark: Gitleaks: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- :x: Gitleaks: ${{ needs.secrets.result }}" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.semgrep.result }}" = "success" ]; then
            echo "- :white_check_mark: Semgrep: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- :x: Semgrep: ${{ needs.semgrep.result }}" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.codeql.result }}" = "success" ]; then
            echo "- :white_check_mark: CodeQL: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- :x: CodeQL: ${{ needs.codeql.result }}" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Fail if any required check failed
          if [ "${{ needs.audit.result }}" != "success" ] || \
             [ "${{ needs.deny.result }}" != "success" ] || \
             [ "${{ needs.secrets.result }}" != "success" ]; then
            echo ""
            echo ":warning: **Security checks failed. Please review and fix issues before merging.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo ""
          echo ":shield: **All required security checks passed!**" >> "$GITHUB_STEP_SUMMARY"
