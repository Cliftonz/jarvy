name: Docs Quality

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs-quality.yml'
      - '.lychee.toml'
      - '.vale.ini'
      - '.codespellrc'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'

permissions:
  contents: read

jobs:
  link-check:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}
      - name: Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config .lychee.toml
            --no-progress
            'docs/**/*.md'
            'mkdocs.yml'
          fail: true

  prose-lint:
    name: Prose lint (vale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vale
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        # Vale style loading (`vale sync` for write-good etc.) regresses
        # periodically when the action's vendored toolchain drifts —
        # produces `E100 [loadStyles] Runtime error` with exit code 2
        # before the linter even sees the docs. Since the linter itself
        # is already advisory (`fail_on_error: false`), the right
        # behavior is to also tolerate the loadStyles failure at the
        # step level so docs-quality.yml doesn't block PRs on an infra
        # hiccup. Real content findings still surface via reviewdog
        # annotations when loadStyles succeeds.
        continue-on-error: true
        with:
          version: 3.7.1
          files: docs
          fail_on_error: false # Advisory until baseline established
          reporter: github-pr-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  spell-check:
    name: Spell check (codespell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2.2
        with:
          check_filenames: true
          check_hidden: true
          path: docs/
          ignore_words_file: .codespellignore

  build-strict:
    name: Build (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material[imaging]" cairosvg Pillow mike
      - run: mkdocs build --strict
