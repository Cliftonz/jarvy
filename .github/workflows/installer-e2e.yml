name: Installer E2E

# Executes the documented one-line installers against a REAL published
# release and asserts the whole download → verify → install → run chain:
#   - install.sh  on Ubuntu (x86_64 musl) + macOS (arm64)
#   - install.ps1 on Windows (x86_64 msvc)
#
# What it guards that nothing else did:
#   * the installer is never run in `cargo test` — a broken platform map,
#     a 404'd asset name, or a dead checksum path would ship unnoticed
#     (see the glibc-x86_64 → *-gnu 404 that this suite was written after)
#   * proves the SHA256 integrity gate actually fires ("Checksum verified")
#   * proves add_to_path writes the shell rc line
#
# Triggers on every release (stable AND prerelease) so a cut is validated
# through the installer, plus manual dispatch to reverify any tag. PRs that
# touch the installers run them against the pinned PR_TAG release below.

on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'dist/scripts/**'
      - '.github/workflows/installer-e2e.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to install (e.g. v0.5.2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: installer-e2e-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  JARVY_TELEMETRY: '0'
  # A real published release for PR runs to install; bump when a newer
  # stable release ships.
  PR_TAG: v0.8.4

jobs:
  setup:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
      core: ${{ steps.r.outputs.core }}
      prerelease: ${{ steps.r.outputs.prerelease }}
    steps:
      - id: r
        env:
          RESOLVED_TAG: ${{ github.event.release.tag_name || inputs.tag || env.PR_TAG }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          TAG="$RESOLVED_TAG"
          VERSION="${TAG#v}"          # keep any -rc.N / -beta.N suffix
          CORE="${VERSION%%-*}"       # semver core only, for --version compare
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            PRE="$RELEASE_PRERELEASE"
          elif [[ "$TAG" == *-* ]]; then PRE=true; else PRE=false; fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "core=$CORE"
            echo "prerelease=$PRE"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG version=$VERSION core=$CORE prerelease=$PRE"

  unix:
    name: install.sh (${{ matrix.name }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Ubuntu x86_64
          - os: macos-15
            name: macOS arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      CORE: ${{ needs.setup.outputs.core }}
      PRERELEASE: ${{ needs.setup.outputs.prerelease }}
      E2E_INSTALL_DIR: ${{ github.workspace }}/../jarvy-e2e/bin
      # install.sh's gh_api_fetch sends this as a Bearer token; macOS hosted runners share egress IPs and hit the unauthenticated /releases/latest rate limit.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install via install.sh (pinned version)
        run: |
          set -euo pipefail
          export JARVY_VERSION="$VERSION"
          export JARVY_INSTALL_DIR="$E2E_INSTALL_DIR"
          export JARVY_NO_MODIFY_PATH=1   # invoke by absolute path below
          bash dist/scripts/install.sh 2>&1 | tee install.log

          # The integrity gate must have fired against the real
          # SHA256SUMS.txt — this is the regression guard for the
          # dead-code verify_checksum bug.
          grep -q "Checksum verified" install.log \
            || { echo "::error::install.sh did not verify the checksum"; exit 1; }

          OBSERVED="$("$JARVY_INSTALL_DIR/jarvy" --version | awk '{print $2}')"
          OBSERVED_CORE="${OBSERVED%%-*}"
          if [ "$OBSERVED_CORE" != "$CORE" ]; then
            echo "::error::version mismatch: installed $OBSERVED, expected core $CORE"
            exit 1
          fi
          echo "✓ installed + verified: $OBSERVED"

      - name: Reinstall over a running jarvy
        run: |
          set -euo pipefail
          export JARVY_VERSION="$VERSION"
          export JARVY_INSTALL_DIR="$E2E_INSTALL_DIR"
          export JARVY_NO_MODIFY_PATH=1
          bin="$JARVY_INSTALL_DIR/jarvy"
          # Hold `jarvy mcp` open on a live stdin pipe, the way Claude Code
          # and Cursor keep it running as an MCP server.
          fifo="$RUNNER_TEMP/jarvy-mcp.in"
          mkfifo "$fifo"
          "$bin" mcp < "$fifo" >/dev/null &
          pid=$!
          tail -f /dev/null > "$fifo" &
          feeder=$!
          trap 'kill "$pid" "$feeder" 2>/dev/null || true' EXIT
          sleep 2
          kill -0 "$pid" || { echo "::error::jarvy mcp exited before reinstall"; exit 1; }

          inode_before="$(ls -i "$bin" | awk '{print $1}')"
          bash dist/scripts/install.sh

          OBSERVED="$("$bin" --version | awk '{print $2}')"
          if [ "${OBSERVED%%-*}" != "$CORE" ]; then
            echo "::error::version mismatch after reinstall: $OBSERVED, expected core $CORE"
            exit 1
          fi
          kill -0 "$pid" || { echo "::error::running jarvy mcp died during reinstall"; exit 1; }
          if [ "$(ls -i "$bin" | awk '{print $1}')" = "$inode_before" ]; then
            echo "::error::reinstall did not replace $bin (inode unchanged)"
            exit 1
          fi
          echo "✓ reinstalled over running binary: $OBSERVED"

      - name: Installed jarvy is mode 755
        run: |
          set -euo pipefail
          perms="$(ls -l "$E2E_INSTALL_DIR/jarvy" | cut -c1-10)"
          if [ "$perms" != "-rwxr-xr-x" ]; then
            echo "::error::installed jarvy has mode $perms, expected -rwxr-xr-x"
            exit 1
          fi
          echo "✓ installed jarvy is $perms"

      - name: Failed install leaves no staged file
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          export JARVY_VERSION="$VERSION"
          export JARVY_INSTALL_DIR="$RUNNER_TEMP/jarvy-staged/bin"
          export JARVY_NO_MODIFY_PATH=1
          shadow="$RUNNER_TEMP/failing-chmod"
          mkdir -p "$shadow"
          printf '#!/bin/sh\necho "stub chmod failed" >&2\nexit 1\n' > "$shadow/chmod"
          chmod 755 "$shadow/chmod"
          if out="$(PATH="$shadow:$PATH" bash dist/scripts/install.sh 2>&1)"; then
            echo "$out"
            echo "::error::install.sh succeeded with a failing chmod"
            exit 1
          fi
          echo "$out"
          if ! grep -q "stub chmod failed" <<< "$out"; then
            echo "::error::install failed, but not at the stubbed chmod"
            exit 1
          fi
          leftover="$(find "$JARVY_INSTALL_DIR" -name '.jarvy.*')"
          if [ -n "$leftover" ]; then
            echo "::error::failed install left a staged file behind: $leftover"
            exit 1
          fi
          echo "✓ no staged file left after a failed install"

      - name: Refuses a symlinked jarvy
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          export JARVY_VERSION="$VERSION"
          export JARVY_INSTALL_DIR="$RUNNER_TEMP/jarvy-linked/bin"
          export JARVY_NO_MODIFY_PATH=1
          mkdir -p "$JARVY_INSTALL_DIR"
          target="$RUNNER_TEMP/elsewhere-jarvy"
          touch "$target"
          ln -s "$target" "$JARVY_INSTALL_DIR/jarvy"
          if out="$(bash dist/scripts/install.sh 2>&1)"; then
            echo "$out"
            echo "::error::install.sh replaced a symlinked jarvy instead of refusing"
            exit 1
          fi
          echo "$out"
          if ! grep -q "is a symlink, so jarvy there is managed elsewhere" <<< "$out"; then
            echo "::error::install failed, but not with the symlink refusal"
            exit 1
          fi
          if [ "$(readlink "$JARVY_INSTALL_DIR/jarvy")" != "$target" ]; then
            echo "::error::symlinked jarvy no longer points at $target"
            exit 1
          fi
          echo "✓ symlinked jarvy refused and left intact"

      - name: Replaces a dangling symlinked jarvy
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          export JARVY_VERSION="$VERSION"
          export JARVY_INSTALL_DIR="$RUNNER_TEMP/jarvy-dangling/bin"
          export JARVY_NO_MODIFY_PATH=1
          mkdir -p "$JARVY_INSTALL_DIR"
          ln -s "$RUNNER_TEMP/does-not-exist" "$JARVY_INSTALL_DIR/jarvy"
          bash dist/scripts/install.sh
          perms="$(ls -l "$JARVY_INSTALL_DIR/jarvy" | cut -c1-10)"
          if [ "$perms" != "-rwxr-xr-x" ]; then
            echo "::error::dangling symlink became $perms, expected a -rwxr-xr-x regular file"
            exit 1
          fi
          echo "✓ dangling symlink replaced by $perms"

      - name: Refuses a directory at the jarvy path
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          export JARVY_VERSION="$VERSION"
          export JARVY_INSTALL_DIR="$RUNNER_TEMP/jarvy-dirtarget/bin"
          export JARVY_NO_MODIFY_PATH=1
          mkdir -p "$JARVY_INSTALL_DIR/jarvy"
          if out="$(bash dist/scripts/install.sh 2>&1)"; then
            echo "$out"
            echo "::error::install.sh did not refuse a directory at the jarvy path"
            exit 1
          fi
          echo "$out"
          if ! grep -q "jarvy is a directory" <<< "$out"; then
            echo "::error::install failed, but not with the directory refusal"
            exit 1
          fi
          echo "✓ directory at the jarvy path refused"

      - name: Installs into a dir with an apostrophe
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          export JARVY_VERSION="$VERSION"
          export JARVY_INSTALL_DIR="$RUNNER_TEMP/o'neil/bin"
          export JARVY_NO_MODIFY_PATH=1
          export TMPDIR="$RUNNER_TEMP/apostrophe-tmp"
          mkdir -p "$TMPDIR"
          bash dist/scripts/install.sh
          leftover="$(find "$JARVY_INSTALL_DIR" "$TMPDIR" -mindepth 1 ! -name jarvy)"
          if [ -n "$leftover" ]; then
            echo "::error::install left files behind: $leftover"
            exit 1
          fi
          "$JARVY_INSTALL_DIR/jarvy" --version
          echo "✓ installed into a dir with an apostrophe, nothing left behind"

      - name: sh without bash gets the bash guard
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          if out="$(sh dist/scripts/install.sh 2>&1)"; then
            echo "$out"
            echo "::error::install.sh ran under sh (dash) without refusing"
            exit 1
          fi
          echo "$out"
          if ! grep -q "install.sh requires bash" <<< "$out"; then
            echo "::error::sh run failed, but not with the bash guard message"
            exit 1
          fi
          echo "✓ sh run refused with the bash guard message"

      - name: add_to_path writes the shell rc line
        run: |
          set -euo pipefail
          # Isolated HOME with a real .bashrc so add_to_path has a
          # deterministic target regardless of the runner's dotfiles.
          FAKE_HOME="$(mktemp -d)"
          touch "$FAKE_HOME/.bashrc"
          HOME="$FAKE_HOME" SHELL="/bin/bash" \
            JARVY_VERSION="$VERSION" \
            JARVY_INSTALL_DIR="$FAKE_HOME/.local/bin" \
            bash dist/scripts/install.sh >/dev/null 2>&1
          if ! grep -q "$FAKE_HOME/.local/bin" "$FAKE_HOME/.bashrc"; then
            echo "::error::install.sh did not add the install dir to .bashrc"
            cat "$FAKE_HOME/.bashrc"
            exit 1
          fi
          echo "✓ PATH line written to .bashrc"

      - name: Latest-channel resolution (stable releases only)
        if: needs.setup.outputs.prerelease == 'false'
        run: |
          set -euo pipefail
          # Exercise get_latest_version: no pinned version, stable channel.
          # Only meaningful on a stable cut (the release IS latest); a
          # prerelease is invisible to the stable /releases/latest endpoint.
          export JARVY_INSTALL_DIR="$HOME/jarvy-latest/bin"
          export JARVY_NO_MODIFY_PATH=1
          export JARVY_CHANNEL=stable
          bash dist/scripts/install.sh 2>&1 | tee latest.log
          grep -q "Checksum verified" latest.log
          "$JARVY_INSTALL_DIR/jarvy" --version

  windows:
    name: install.ps1 (Windows x86_64, ${{ matrix.shell }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        # powershell is Windows PowerShell 5.1, what `irm | iex` runs on
        # stock Windows; pwsh is PowerShell 7.
        shell: [pwsh, powershell]
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      CORE: ${{ needs.setup.outputs.core }}
      INSTALLER_SHELL: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install via install.ps1 (pinned version)
        shell: pwsh
        run: |
          $env:JARVY_VERSION = $env:VERSION
          $env:JARVY_INSTALL_DIR = "$env:RUNNER_TEMP\jarvy-e2e"
          # Run the installer in a child shell so its internal `exit` on
          # failure doesn't skip the assertions below.
          $out = & $env:INSTALLER_SHELL -NoProfile -File dist/scripts/install.ps1 2>&1
          $rc = $LASTEXITCODE
          Write-Host ($out | Out-String)
          $text = ($out -join ' ') -replace '\s+', ' '
          if ($rc -ne 0) { Write-Host "::error::install.ps1 exited $rc"; exit 1 }
          if ($text -notmatch 'Checksum verified') {
            Write-Host "::error::install.ps1 did not verify the checksum"; exit 1
          }

          $bin = Join-Path $env:JARVY_INSTALL_DIR 'jarvy.exe'
          $observed = (& $bin --version).Split(' ')[1]
          if ($observed.Split('-')[0] -ne $env:CORE) {
            Write-Host "::error::version mismatch: installed $observed, expected core $env:CORE"
            exit 1
          }
          Write-Host "OK installed + verified: $observed"

      - name: Reinstall over a running jarvy.exe
        shell: pwsh
        run: |
          $env:JARVY_VERSION = $env:VERSION
          # Forward slashes and a space, so the installer must normalize the
          # dir to match the path Get-Process reports.
          $env:JARVY_INSTALL_DIR = "$env:RUNNER_TEMP/jarvy e2e/fwd" -replace '\\', '/'
          & $env:INSTALLER_SHELL -NoProfile -File dist/scripts/install.ps1 | Out-Host
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::initial install into $env:JARVY_INSTALL_DIR exited $LASTEXITCODE"; exit 1 }
          $bin = Join-Path $env:JARVY_INSTALL_DIR 'jarvy.exe'
          # Hold `jarvy mcp` open on a live stdin pipe, the way Claude Code
          # and Cursor keep it running as an MCP server.
          $psi = [System.Diagnostics.ProcessStartInfo]::new($bin, 'mcp')
          $psi.RedirectStandardInput = $true
          $psi.UseShellExecute = $false
          $proc = [System.Diagnostics.Process]::Start($psi)
          try {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) { Write-Host "::error::jarvy mcp exited before reinstall"; exit 1 }

            $out = & $env:INSTALLER_SHELL -NoProfile -File dist/scripts/install.ps1 2>&1
            $rc = $LASTEXITCODE
            Write-Host ($out | Out-String)
            $text = ($out -join ' ') -replace '\s+', ' '
            if ($rc -ne 0) { Write-Host "::error::reinstall over running exe exited $rc"; exit 1 }
            if ($text -notmatch 'keep the old version until restarted') {
              Write-Host "::error::no warning about running sessions"; exit 1
            }

            $observed = (& $bin --version).Split(' ')[1]
            if ($observed.Split('-')[0] -ne $env:CORE) {
              Write-Host "::error::version mismatch after reinstall: $observed, expected core $env:CORE"
              exit 1
            }
            if (-not (Get-ChildItem -Path $env:JARVY_INSTALL_DIR -Filter 'jarvy.exe.old*')) {
              Write-Host "::error::running exe was not moved aside to jarvy.exe.old*"; exit 1
            }
            Write-Host "OK reinstalled over running exe: $observed"

            # The first process now runs from jarvy.exe.old, so the stale
            # .old cannot be deleted and the exe must park under a unique name.
            $out = & $env:INSTALLER_SHELL -NoProfile -File dist/scripts/install.ps1 2>&1
            $rc = $LASTEXITCODE
            Write-Host ($out | Out-String)
            $text = ($out -join ' ') -replace '\s+', ' '
            if ($rc -ne 0) { Write-Host "::error::reinstall over running .old exited $rc"; exit 1 }
            if ($text -notmatch 'keep the old version until restarted') {
              Write-Host "::error::no warning about running sessions on stale-.old reinstall"; exit 1
            }
            if (-not (Get-ChildItem -Path $env:JARVY_INSTALL_DIR -Filter 'jarvy.exe.old.*')) {
              Write-Host "::error::stale running .old did not fall back to jarvy.exe.old.<suffix>"; exit 1
            }
            $observed = (& $bin --version).Split(' ')[1]
            if ($observed.Split('-')[0] -ne $env:CORE) {
              Write-Host "::error::version mismatch after stale-.old reinstall: $observed, expected core $env:CORE"
              exit 1
            }
            Write-Host "OK reinstalled over running .old: $observed"
          }
          finally {
            $proc.Kill()
          }

      - name: Failed copy rolls back to the previous jarvy.exe
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:JARVY_VERSION = $env:VERSION
          $env:JARVY_INSTALL_DIR = "$env:RUNNER_TEMP\jarvy-rollback"
          $bin = Join-Path $env:JARVY_INSTALL_DIR 'jarvy.exe'
          & $env:INSTALLER_SHELL -NoProfile -File dist/scripts/install.ps1 | Out-Host
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::initial install into $env:JARVY_INSTALL_DIR exited $LASTEXITCODE"; exit 1 }

          # Shadow Copy-Item so the copy fails after the old exe was moved
          # aside: R1 leaves a partial jarvy.exe, R2 also holds it locked so
          # the move-back fails.
          $partial = "function Copy-Item { param(`$Path, `$LiteralPath, `$Destination) [IO.File]::WriteAllText(`$Destination, 'partial'); throw (New-Object IO.IOException 'injected copy failure') };"
          $locked = "function Copy-Item { param(`$Path, `$LiteralPath, `$Destination) `$global:h = [IO.File]::Open(`$Destination, 'Create', 'ReadWrite', 'None'); throw (New-Object IO.IOException 'injected copy failure') };"

          $out = & $env:INSTALLER_SHELL -NoProfile -Command "$partial & 'dist/scripts/install.ps1'" 2>&1
          $rc = $LASTEXITCODE
          Write-Host ($out | Out-String)
          $text = ($out -join ' ') -replace '\s+', ' '
          if ($rc -eq 0) { Write-Host "::error::install succeeded despite a failing copy"; exit 1 }
          if ($text -notmatch 'injected copy failure') {
            Write-Host "::error::original copy error not shown"; exit 1
          }
          if (Get-ChildItem -Path $env:JARVY_INSTALL_DIR -Filter 'jarvy.exe.old*') {
            Write-Host "::error::previous exe was not moved back from jarvy.exe.old*"; exit 1
          }
          $observed = (& $bin --version).Split(' ')[1]
          if ($observed.Split('-')[0] -ne $env:CORE) {
            Write-Host "::error::restored jarvy.exe reports $observed, expected core $env:CORE"
            exit 1
          }
          Write-Host "OK partial copy rolled back: $observed"

          $out = & $env:INSTALLER_SHELL -NoProfile -Command "$locked & 'dist/scripts/install.ps1'" 2>&1
          $rc = $LASTEXITCODE
          Write-Host ($out | Out-String)
          $text = ($out -join ' ') -replace '\s+', ' '
          $aside = "$bin.old"
          if ($rc -ne 1) { Write-Host "::error::stranded swap exited $rc, expected 1"; exit 1 }
          if (-not $text.Contains("[ERROR] The previous binary is at $aside; rename it to $bin manually.")) {
            Write-Host "::error::stranded swap did not name the aside file"; exit 1
          }
          if (-not (Test-Path -LiteralPath $aside)) {
            Write-Host "::error::aside file $aside is missing"; exit 1
          }
          Write-Host "OK stranded swap reported the aside file"
          # The runner exits with $LASTEXITCODE, still the installer's expected 1.
          exit 0
