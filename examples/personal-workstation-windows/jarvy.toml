# jarvy.toml
# Personal workstation bootstrap; Windows work machine
# Bootstrap Jarvy itself first (it cannot provision itself):
#   irm https://raw.githubusercontent.com/Cliftonz/jarvy/main/dist/scripts/install.ps1 | iex
# Then: jarvy validate && jarvy setup --dry-run, then jarvy setup

# ---------------------------------------------------------------------------
# Tools
# Direct entries; installed via winget/Chocolatey/Scoop on Windows
# ---------------------------------------------------------------------------
[provisioner]
# Core
git       = "latest"
gh        = "latest"
jq        = "latest"
docker    = "latest"

# Language toolchains; pinned majors, version managers where available
node      = { version = "22", version_manager = true }
python    = { version = "3.12", version_manager = true }
go        = "latest"
rust      = "latest"

# Kubernetes / platform stack (IR, RMX, homelab)
kubectl   = "latest"
helm      = "latest"
k9s       = "latest"
kind      = "latest"
kustomize = "latest"
stern     = "latest"
dive      = "latest"
terraform = "^1.9"
awscli    = "latest"
argocd    = "latest"
talosctl  = "latest"
omnictl   = "latest"
crossplane = "latest"
nats      = "latest"
# cockroach / clickhouse are not yet in the jarvy tool registry — install
# manually from upstream for now.
cosign    = "latest"

# Audio / websocket utilities — ffmpeg / websocat are not yet in the
# jarvy tool registry either.

# ---------------------------------------------------------------------------
# Language packages
# ---------------------------------------------------------------------------
[cargo]
cargo-watch   = "latest"
cargo-nextest = "latest"

[npm]
typescript = "^5.0"
"@anthropic-ai/claude-code" = "latest"

[pip]
venv = ".venv"
create_venv = false

# ---------------------------------------------------------------------------
# Hooks
# ---------------------------------------------------------------------------
[hooks.config]
shell = "powershell"
timeout = 600
continue_on_error = false

[hooks.node]
post_install = "corepack enable"

# GUI desktop apps via winget; not all are in the Jarvy tool registry yet,
# so this hook installs them directly. Idempotent: skips anything present.
# Docker Compose needs no entry; it ships inside Docker Desktop as a plugin.
# Jarvy keeps itself current via its own updater; the check runs last.
[hooks]
post_setup = '''
$apps = @(
  "JetBrains.Toolbox",
  "Anthropic.Claude",
  "Microsoft.VisualStudioCode",
  "ImputNet.Helium",
  "OpenAI.ChatGPT"
)
foreach ($app in $apps) {
  $installed = winget list --id $app -e 2>$null | Select-String -Quiet $app
  if (-not $installed) {
    winget install --id $app -e --accept-package-agreements --accept-source-agreements
  } else {
    Write-Host "skip: $app already installed"
  }
}
kubectl version --client
helm version
jarvy update check
'''

# ---------------------------------------------------------------------------
# Git configuration
# Email comes from an env var so this file stays shareable across machines
# ---------------------------------------------------------------------------
[git]
user_name = "Zac Clifton"
user_email = { env = "GIT_EMAIL" }

default_branch = "main"
pull_rebase = true
auto_stash = true
push_autosetup = true

# Critical on Windows: keep LF in the repo, convert nothing on commit
autocrlf = "input"
eol = "lf"

credential_helper = "manager-core"
scope = "global"

[git.aliases]
co = "checkout"
br = "branch"
ci = "commit"
st = "status"
lg = "log --oneline --graph --decorate"

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
[env.vars]
EDITOR = "code --wait"
KUBE_EDITOR = "code --wait"

[env.config]
update_rc = false
generate_dotenv = false

# ---------------------------------------------------------------------------
# Drift detection
# ---------------------------------------------------------------------------
[drift]
enabled = true
version_policy = "minor"
allow_upgrades = true

# ---------------------------------------------------------------------------
# Corporate network
# Uncomment and fill in if traffic routes through a proxy or TLS inspection;
# Jarvy propagates these to curl, node, pip, and git
# ---------------------------------------------------------------------------
# [network]
# https_proxy = "http://proxy.irco.com:8080"
# no_proxy = ["localhost", "127.0.0.1", ".irco.com"]
#
# [network.tls]
# ca_bundle = "C:/certs/ir-corporate-ca.crt"

# ---------------------------------------------------------------------------
# Convenience commands (jarvy run)
# ---------------------------------------------------------------------------
[commands]
setup = "jarvy setup"
doctor = "jarvy doctor --extended"
drift = "jarvy drift check"
update = "jarvy update"
